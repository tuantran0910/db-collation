# Ruff configuration for repository release tooling (a separate Python project
# from the differential harness).

target-version = "py311"
line-length = 100
extend-exclude = [".venv", "__pycache__"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line length is handled by the formatter
]

[lint.per-file-ignores]
"tests/*" = ["S101"]
