[package]
name = "harness-candidate"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Differential-harness candidate: drives db-collation over a corpus. Not part of the library."

[[bin]]
name = "harness-candidate"
path = "src/main.rs"

[dependencies]
db-collation = { workspace = true, features = ["postgres-icu", "mysql-uca", "oracle-uca"] }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
