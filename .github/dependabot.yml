version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      cargo-major:
        applies-to: version-updates
        update-types:
          - major
    labels:
      - dependencies
      - rust

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
      include: scope
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - minor
          - patch
          - major
    labels:
      - dependencies
      - ci

  - package-ecosystem: pip
    directory: "/harness"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      pip-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      pip-major:
        applies-to: version-updates
        update-types:
          - major
    labels:
      - dependencies
      - python
