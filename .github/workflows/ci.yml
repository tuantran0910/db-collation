name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ICU (for postgres-icu feature)
        run: sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  features:
    name: features (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - features: ""
            args: "--no-default-features"
          - features: "default"
            args: ""
          - features: "postgres-icu"
            args: "--no-default-features --features postgres-icu"
          - features: "mysql-uca"
            args: "--no-default-features --features mysql-uca"
          - features: "oracle"
            args: "--no-default-features --features oracle"
          - features: "oracle-uca"
            args: "--no-default-features --features oracle-uca"
          # Serde-only: no backends compiled, so deserializing a backend
          # description must fail (disabled-backend path).
          - features: "serde-only"
            args: "--no-default-features --features serde"
          # Serde plus the default backends.
          - features: "serde+default"
            args: "--features serde"
          - features: "all"
            args: "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ICU (for postgres-icu feature)
        run: sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config
      # Build/test the library crate in isolation so workspace feature
      # unification (the candidate always enables both backends) cannot mask a
      # broken feature combination.
      - name: Build (db-collation, isolated)
        run: cargo build -p db-collation --all-targets ${{ matrix.args }}
      # Lint each isolated combination too: workspace feature unification (the
      # candidate enables every backend) can otherwise hide dead code that only
      # appears for a single feature.
      - name: Clippy (db-collation, isolated)
        run: cargo clippy -p db-collation --all-targets ${{ matrix.args }} -- -D warnings
      - name: Test (db-collation, isolated)
        run: cargo test -p db-collation ${{ matrix.args }}

  workspace-all-features:
    name: workspace (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ICU (for postgres-icu feature)
        run: sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config
      - name: Check all targets (workspace)
        run: cargo check --workspace --all-targets --all-features
      - name: Test all (workspace)
        run: cargo test --workspace --all-features

  python:
    name: python (harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: python -m pip install -r harness/requirements.txt
      - name: Run harness unit tests (no Docker)
        run: python -m unittest discover -s harness/tests
      - name: Check weight-table regeneration drift
        run: python -m harness.check_weights
      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check --config harness/ruff.toml harness"
      - uses: astral-sh/ruff-action@v3
        with:
          args: "check --config harness/ruff.toml harness"
      - name: Check release-tooling formatting
        run: pip install ruff && ruff format --check --config tools/ruff.toml tools
      - name: Lint release tooling
        run: ruff check --config tools/ruff.toml tools
      - name: Run release-tooling unit tests
        run: python -m unittest discover -s tools/tests -t tools/tests
      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: harness/candidate.Dockerfile
      - name: Check Dockerfile formatting
        env:
          DOCKERFMT_VERSION: v0.5.4
        run: |
          # dockerfmt publishes release binaries (the old install.sh is gone).
          # Pin the version so formatting cannot change under us.
          curl -sSfL -o /tmp/dockerfmt.tar.gz \
            "https://github.com/reteps/dockerfmt/releases/download/${DOCKERFMT_VERSION}/dockerfmt-${DOCKERFMT_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/dockerfmt.tar.gz -C /usr/local/bin dockerfmt
          dockerfmt --check harness/candidate.Dockerfile

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ICU (for postgres-icu feature)
        run: sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config
      - name: Build docs
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Install ICU (for postgres-icu feature)
        run: sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config
      - run: cargo build --workspace --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Differential harness: compares the real crate against live source
  # databases. This is the acceptance criterion for backend changes. For
  # PostgreSQL the candidate image is built FROM the oracle image so it links
  # the identical ICU.
  harness:
    name: harness (${{ matrix.engine }} ${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: postgres
            image: postgres:14
            port: 18432
          - engine: postgres
            image: postgres:15
            port: 18432
          - engine: postgres
            image: postgres:15-bookworm
            port: 18432
          - engine: postgres
            image: postgres:16
            port: 18432
          - engine: postgres
            image: postgres:17
            port: 18432
          - engine: postgres
            image: postgres:18
            port: 18432
          - engine: mysql
            image: mysql:8.0
            port: 18306
          - engine: mysql
            image: mysql:8.4
            port: 18306
          - engine: mysql
            image: mysql:9.4
            port: 18306
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: python -m pip install -r harness/requirements.txt
      - name: Pull source image
        run: docker pull ${{ matrix.image }}
      # The MySQL candidate runs on the host; PostgreSQL builds its candidate
      # image inside the runner (see candidate.Dockerfile).
      - name: Build host candidate (MySQL)
        if: matrix.engine == 'mysql'
        run: |
          sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config
          cargo build --release -p harness-candidate
      - name: Run differential harness
        run: |
          python -m harness.run \
            --engine ${{ matrix.engine }} \
            --images ${{ matrix.image }} \
            --out harness-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.engine }}-${{ strategy.job-index }}
          path: harness-report.json
          if-no-files-found: ignore

  # Opt-in Oracle differential harness. The Oracle Free image is an ARM64
  # multi-arch build pinned by digest, so this runs on an ARM runner and only on
  # manual dispatch (it is not part of the PR gate). The Oracle candidate runs on
  # the host; only the crate and `oracledb` are needed.
  oracle-harness:
    name: oracle harness (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: python -m pip install -r harness/requirements.txt
      - name: Pull Oracle image
        run: |
          docker pull gvenzl/oracle-free:23.5-slim-arm64@sha256:0b6d2a693d9f77c8cb5e756411f60a38b4f854cf2a6b0be2f002942a66582aeb
      - name: Build host candidate (Oracle)
        run: cargo build --release -p harness-candidate
      - name: Run Oracle differential harness
        run: python -m harness.run --engine oracle --out harness-oracle-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-oracle
          path: harness-oracle-report.json
          if-no-files-found: ignore

  # Confirm the whole matrix is green before a PR can merge.
  ci-success:
    name: ci-success
    if: always()
    needs:
      [fmt, clippy, features, workspace-all-features, docs, msrv, deny, python, harness]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All jobs succeeded."
