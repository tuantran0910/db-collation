name: Nightly

# Scheduled deep checks that are too slow or time-dependent for every PR:
#   * the full differential matrix over every oracle image,
#   * the full-BMP sweep (all 63,498 BMP scalars) against live MySQL,
#   * `cargo deny` advisories, which change over time even when code does not.
#
# The fast, hermetic checks (including the weight-table drift check) run on
# every pull request in `ci.yml`.

on:
  schedule:
    # 03:17 UTC daily (off the top of the hour to avoid the busy edge).
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  advisories:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Advisories change without code changes, so re-check them on a schedule.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

  harness:
    name: harness (all images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: python -m pip install -r harness/requirements.txt
      - name: Install ICU (host candidate, for the MySQL path)
        run: sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config
      - name: Build host candidate
        run: cargo build --release -p harness-candidate
      - name: Run full differential matrix (PG 14-18, MySQL 8.0/8.4/9.4)
        run: python -m harness.run --engine all --out harness-report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-harness-report
          path: harness-report.json
          if-no-files-found: ignore

  bmp-sweep:
    name: full-BMP sweep (MySQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: python -m pip install -r harness/requirements.txt
      - name: Build host candidate
        run: cargo build --release -p harness-candidate
      - name: Pull MySQL image
        run: docker pull mysql:8.4
      - name: Sweep every BMP scalar against live MySQL
        run: python -m harness.bmp_sweep --image mysql:8.4
